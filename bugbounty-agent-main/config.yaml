# Bug Bounty AI Agent Configuration
# Supply the target with -d/--domain or -t/--target.

ai:
  provider: "auto"
  api_key: ""
  model: ""
  max_tokens: 2000
  base_url: ""

# Legacy Claude settings used by the config loader for backward compatibility.
claude:
  api_key: ""
  model: "claude-sonnet-4-20250514"
  max_tokens: 2000

c99:
  api_key: ""
  enabled: false

target:
  domains: []
  excluded_subdomains: []
  scope: "in-scope-only"

recon:
  enabled: true
  timeout: 300
  max_subdomains: 100
  max_wayback_urls: 1000
  tools:
    subfinder: true
    amass: false
    assetfinder: true
    github_dorking: false
    wayback: true
    katana: false

scanning:
  enabled: true
  threads: 5
  timeout: 300
  rate_limit: 5
  tools:
    httpx:
      enabled: true
      follow_redirects: true
      status_code: true
    nuclei:
      enabled: false
      severity: ["low", "medium", "high", "critical"]
      templates_path: ""
    nmap:
      enabled: false
      ports: "80,443"
      fast_scan: true
    dalfox:
      enabled: false
      blind_url: ""
      max_urls: 10
    ffuf:
      enabled: false
      wordlist_path: ""
      max_targets: 5
    sqlmap:
      enabled: false
      max_urls: 10
    cors:
      enabled: false

analysis:
  enabled: true
  min_confidence: 0.7
  auto_validate: true
  false_positive_filter: true
  js_analysis: true

reporting:
  format: "markdown"
  language: "en"
  include_poc: true
  output_dir: "./reports"

logging:
  level: "info"
  file: "./logs/agent.log"
  max_size_mb: 10
