# BugBasket configuration
# Supply the target with -d/--domain or -t/--target.

c99:
  api_key: ""
  enabled: false

target:
  domains: []
  excluded_subdomains: []
  scope: "in-scope-only"

recon:
  enabled: true
  timeout: 300
  max_subdomains: 100
  max_wayback_urls: 1000
  tools:
    subfinder: true
    amass: true
    assetfinder: true
    github_dorking: true
    wayback: true
    katana: true

scanning:
  enabled: true
  threads: 5
  timeout: 300
  rate_limit: 5
  tools:
    httpx:
      enabled: true
      follow_redirects: true
      status_code: true
    nuclei:
      enabled: true
      severity: ["low", "medium", "high", "critical"]
      templates_path: ""
    nmap:
      enabled: true
      ports: "80,443"
      fast_scan: true
    dalfox:
      enabled: true
      blind_url: ""
      max_urls: 10
    ffuf:
      enabled: true
      wordlist_path: ""
      max_targets: 5
    sqlmap:
      enabled: true
      max_urls: 10
    cors:
      enabled: true

analysis:
  enabled: true
  js_analysis: true

reporting:
  format: "markdown"
  language: "en"
  include_poc: true
  output_dir: "./reports"

logging:
  level: "info"
  file: "./logs/agent.log"
  max_size_mb: 10
